name: injectcheck
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: pip install git+https://github.com/ryssharma18-maker/Injectcheck
      - run: injectcheck --url ${{ secrets.BOT_URL }} --key ${{ secrets.BOT_KEY }} --mutate --report report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injectcheck-report
          path: report.json

