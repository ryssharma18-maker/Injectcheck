[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "injectcheck"
version = "0.1.0"
description = "Scan your AI chatbot for prompt-injection holes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests"]

[project.scripts]
injectcheck = "injectcheck.__main__:main"

[tool.setuptools.package-data]
injectcheck = ["attacks.json"]
